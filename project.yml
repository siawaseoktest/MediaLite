name: MediaLite

options:
  bundleIdPrefix: com.medialite
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  groupSortPosition: top
  generateEmptyDirectories: true
  developmentLanguage: en
  knownRegions:
    - en
    - ja
    - Base

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SDKROOT: iphoneos
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  MediaLite:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MediaLite
    info:
      path: MediaLite/Resources/Info.plist
    settings:
      base:
        PRODUCT_NAME: MediaLite
        PRODUCT_BUNDLE_IDENTIFIER: com.medialite.MediaLite
        INFOPLIST_FILE: MediaLite/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic

  MediaLiteTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MediaLiteTests
    dependencies:
      - target: MediaLite
    settings:
      base:
        PRODUCT_NAME: MediaLiteTests
        PRODUCT_BUNDLE_IDENTIFIER: com.medialite.MediaLiteTests
        SWIFT_VERSION: "5.9"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MediaLite.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MediaLite"
        CODE_SIGN_STYLE: Automatic
