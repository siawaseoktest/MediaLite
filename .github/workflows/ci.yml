name: CI

"on":
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & Package
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode Version
        run: |
          echo "Inspecting installed Xcode installations in /Applications..."
          ls -ld /Applications/Xcode*.app 2>/dev/null || true

          SELECTED_DEVELOPER_DIR=""

          # 1. Prioritize Xcode 26.6 if present
          if [ -d "/Applications/Xcode_26.6.app" ]; then
            SELECTED_DEVELOPER_DIR="/Applications/Xcode_26.6.app/Contents/Developer"
          elif [ -d "/Applications/Xcode-26.6.app" ]; then
            SELECTED_DEVELOPER_DIR="/Applications/Xcode-26.6.app/Contents/Developer"
          else
            # 2. Detect available stable Xcode 26 (exclude beta/preview)
            for app in /Applications/Xcode_26*.app /Applications/Xcode-26*.app; do
              if [ -d "$app" ]; then
                case "$app" in
                  *[bB]eta*|*[pP]review*)
                    echo "Skipping preview/beta Xcode: $app"
                    ;;
                  *)
                    SELECTED_DEVELOPER_DIR="$app/Contents/Developer"
                    break
                    ;;
                esac
              fi
            done

            # 3. Fallback to default /Applications/Xcode.app
            if [ -z "$SELECTED_DEVELOPER_DIR" ] && [ -d "/Applications/Xcode.app" ]; then
              SELECTED_DEVELOPER_DIR="/Applications/Xcode.app/Contents/Developer"
            fi
          fi

          if [ -n "$SELECTED_DEVELOPER_DIR" ]; then
            echo "Selecting Xcode Developer directory: $SELECTED_DEVELOPER_DIR"
            sudo xcode-select -s "$SELECTED_DEVELOPER_DIR"
          else
            echo "No custom Xcode selected; retaining runner default $(xcode-select -p)"
          fi

          echo "=== Active Xcode Information ==="
          xcodebuild -version

          echo "=== Available SDKs ==="
          xcodebuild -showsdks

      - name: Setup Apple Certificate and Keychain (Optional)
        env:
          CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -n "$CERT_BASE64" ] && [ -n "$PROFILE_BASE64" ] && [ -n "$KEYCHAIN_PASSWORD" ]; then
            echo "Signing secrets detected. Configuring ephemeral keychain..."
            KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            CERT_PATH="$RUNNER_TEMP/certificate.p12"
            echo -n "$CERT_BASE64" | base64 --decode -o "$CERT_PATH"
            security import "$CERT_PATH" -P "$KEYCHAIN_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo -n "$PROFILE_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
            echo "Ephemeral keychain and provisioning profile configured successfully."
          else
            echo "No signing secrets provided; proceeding with unsigned builds for CI."
          fi

      - name: Privacy Gate - Zero Network Verification
        run: |
          echo "Scanning production source code for forbidden networking frameworks and symbols..."
          FORBIDDEN_PATTERN='import[[:space:]]+(Network|WebKit|CFNetwork|SystemConfiguration|Alamofire|Socket)|URLSession|NWPathMonitor|WKWebView|NSURLConnection'
          if grep -rn --include="*.swift" -E "$FORBIDDEN_PATTERN" MediaLite/; then
            echo "::error file=MediaLite::Zero-network invariant violated! Forbidden networking modules or symbols detected in production code."
            exit 1
          else
            echo "Privacy check passed: Zero forbidden networking imports or symbols detected in MediaLite/."
          fi

      - name: Swift Syntax & Lint
        run: |
          if command -v swiftlint &> /dev/null; then
            echo "Running SwiftLint..."
            swiftlint lint --reporter github-actions-logging
          else
            echo "SwiftLint not pre-installed, skipping lint step."
          fi

      - name: Run Tests on iOS Simulator
        run: |
          echo "=== Available iOS Simulators ==="
          xcrun simctl list devices available

          echo "Resolving available iPhone Simulator UDID via simctl JSON..."
          SIMULATOR_UDID=$(python3 scripts/detect_simulator.py)

          if [ -z "$SIMULATOR_UDID" ]; then
            echo "::error::No available iPhone simulator found on this runner! Cannot continue test execution."
            echo "=== Full Device List for Debugging ==="
            xcrun simctl list devices
            exit 1
          fi

          DESTINATION="platform=iOS Simulator,id=$SIMULATOR_UDID"
          echo "Target simulator destination: $DESTINATION"

          mkdir -p build/artifacts
          rm -rf build/artifacts/MediaLiteTests.xcresult

          if command -v xcbeautify &> /dev/null; then
            set -o pipefail && xcodebuild test \
              -project MediaLite.xcodeproj \
              -scheme MediaLite \
              -destination "$DESTINATION" \
              -resultBundlePath build/artifacts/MediaLiteTests.xcresult \
              -enableCodeCoverage YES \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" | xcbeautify
          else
            xcodebuild test \
              -project MediaLite.xcodeproj \
              -scheme MediaLite \
              -destination "$DESTINATION" \
              -resultBundlePath build/artifacts/MediaLiteTests.xcresult \
              -enableCodeCoverage YES \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          fi

      - name: Upload Test Results (.xcresult)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MediaLiteTests-xcresult
          path: build/artifacts/MediaLiteTests.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Build Release Archive
        if: success()
        run: |
          mkdir -p build/artifacts
          rm -rf build/artifacts/MediaLite.xcarchive build/artifacts/MediaLite.xcarchive.zip

          echo "Archiving release build (unsigned)..."
          xcodebuild archive \
            -project MediaLite.xcodeproj \
            -scheme MediaLite \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/artifacts/MediaLite.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          echo "Packaging xcarchive into zip archive..."
          cd build/artifacts
          zip -r -y MediaLite.xcarchive.zip MediaLite.xcarchive
          cd -

      - name: Upload Release Archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MediaLite-Release-Archive
          path: |
            build/artifacts/MediaLite.xcarchive.zip
            build/artifacts/MediaLite.xcarchive
          if-no-files-found: error
          retention-days: 30

      - name: Clean up Keychain
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/build.keychain-db" ]; then
            echo "Cleaning up ephemeral keychain..."
            security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          fi
